<body data-page="projects">

<div class="frame" id="frame" aria-hidden="true"></div>

<dialog class="sheet" id="projDlg" aria-labelledby="dlgTitle">
  <div class="sheet-head">
    <span class="sheet-no" id="dlgNo"></span>
    <button class="sheet-x" id="dlgX" type="button" aria-label="Close">&#215;</button>
  </div>
  <div class="sheet-grid">
    <div class="sheet-fig" id="dlgFig"></div>
    <div class="sheet-tx">
      <h3 id="dlgTitle"></h3>
      <div class="who" id="dlgWho"></div>
      <div class="when" id="dlgWhen"></div>
      <p id="dlgBody"></p>
      <div class="spec" id="dlgSpec"></div>
      <div class="out" id="dlgOut"></div>
    </div>
  </div>
</dialog>

<div class="stage" id="stage" aria-hidden="true">
  <svg id="arm" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#10151A" stroke-width=".8"/>
      </pattern>
    </defs>
    <g id="gEnv"></g>
    <g id="gBase"></g>
    <g id="gChain"></g>
    <g id="gStrut"></g>
  </svg>
</div>

<div class="note">
  <b id="nMode">idle</b>
  <dl>
    <dt>J1</dt><dd id="nJ1">0.0</dd>
    <dt>J2</dt><dd id="nJ2">0.0</dd>
    <dt>J3</dt><dd id="nJ3">0.0</dd>
    <dt>ITEM</dt><dd id="nI">--</dd>
    <dt>GRIP</dt><dd id="nP">OPEN</dd>
    <dt>EXT</dt><dd id="nR" class="m">0%</dd>
  </dl>
</div>

<header class="bar">
  <a class="brand" href="index.html">Paul Nguyen <s>ME/EE</s></a>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>

<main class="shell" id="shell">

  <section class="view on" data-view="projects">
    <div class="band"><h2>Projects</h2><span class="tag" id="pn"></span></div>
    <p class="lede">Hardware, research, and a few things in between.</p>
    <div class="plan" id="plan"></div>
  </section>

</main>

<div class="titleblock">
  <div>
    <span><em>Drawn</em>P. Nguyen</span>
    <span><em>Sheet</em><i id="tbSheet" style="font-style:normal">01</i></span>
    <span><em>Scale</em>1:1</span>
    <span><em>Rev</em><i id="tbYear" style="font-style:normal"></i></span>
  </div>
</div>

<script src="assets/site.js"></script>
<script src="assets/arm.js"></script>

</html>
